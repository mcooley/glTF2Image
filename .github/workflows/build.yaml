name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04]
        build_type: [release, debug]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'true'

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Set up .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.x'

    - name: Build native libraries (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products '*' -version '[18.0,19.0)' -property installationPath
        if (-not $vs) { throw 'Visual Studio 2026 was not found.' }
        $arch = $env:RUNNER_ARCH.ToLowerInvariant()
        # Keep the build in the same cmd.exe process so it inherits the MSVC environment.
        & $env:ComSpec /d /c "call `"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch -vcvars_ver=14.44 && python native\build-native.py ${{ matrix.build_type }}"

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang-18 libc++-18-dev libc++abi-18-dev ninja-build
        echo 'CC=/usr/bin/clang-18' >> "$GITHUB_ENV"
        echo 'CXX=/usr/bin/clang++-18' >> "$GITHUB_ENV"

    - name: Build native libraries (Linux)
      if: runner.os == 'Linux'
      run: python native/build-native.py ${{ matrix.build_type }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          native/out

    - name: Run GLTF2Image.Tests
      run: dotnet test -c ${{ matrix.build_type == 'debug' && 'Debug' || 'Release' }} managed/GLTF2Image.Tests/GLTF2Image.Tests.csproj

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.x'

    - name: Download build artifacts (windows-2025-vs2026-release)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-windows-2025-vs2026-release
        path: native/out

    - name: Download build artifacts (ubuntu-24.04-release)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-ubuntu-24.04-release
        path: native/out

    - name: Extract version from tag
      id: extract_version
      if: github.event_name == 'release'
      run: |
        VERSION=${{ github.event.release.tag_name }}
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Set version to 0.0.0
      id: default_version
      if: github.event_name != 'release'
      run: echo "version=0.0.0" >> $GITHUB_OUTPUT

    - name: Build NuGet package
      run: dotnet build -c Release managed/GLTF2Image/GLTF2Image.csproj /p:Version=${{ steps.extract_version.outputs.version || steps.default_version.outputs.version }} /p:GLTF2ImageRequireAllPlatforms=true

    - name: Upload NuGet package to build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-package
        path: managed/GLTF2Image/bin/Release/*.nupkg

    - name: Upload NuGet package to release
      if: github.event_name == 'release'
      run: gh release upload ${{ github.event.release.tag_name }} managed/GLTF2Image/bin/Release/*.nupkg
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
